AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LedgerIR - deterministic financial compiler pipeline for Indian MSMEs.
  100% serverless: S3 + DynamoDB + HTTP API + Step Functions + arm64 Lambdas.
  Deployed with `sam build && sam deploy` only (no pipelines).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref LedgerTable
        DOCS_BUCKET: !Ref DocsBucket
        DOSSIER_BUCKET: !Ref DossierBucket

Resources:
  # ---------------------------------------------------------------- storage
  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3600

  # Audit dossiers are write-once: Object Lock in compliance mode with a short
  # retention window sized for the demo (locked objects cannot be deleted
  # until retention expires, so keep it at 1 day).
  DossierBucket:
    Type: AWS::S3::Bucket
    Properties:
      ObjectLockEnabled: true
      VersioningConfiguration: { Status: Enabled }
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: { Mode: COMPLIANCE, Days: 1 }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ---------------------------------------------------------------- compute
  AstCompilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ast_compiler/
      Handler: app.lambda_handler
      Description: OCR tokens -> typed Invoice AST with algebraic repair proofs
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref LedgerTable }
        - S3ReadPolicy: { BucketName: !Ref DocsBucket }

  GraphReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/graph_reconciler/
      Handler: app.lambda_handler
      Description: GSTR-2B/bank loaders, subset-sum reconciler, IMS triage, Merkle
      Timeout: 60
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref LedgerTable }
        - S3ReadPolicy: { BucketName: !Ref DocsBucket }
        - S3CrudPolicy: { BucketName: !Ref DossierBucket }

  # Placeholder zip Lambda until the Phase-4 arm64 ONNX container lands: it
  # fails loudly for image keys and the pipeline routes *_tokens.json around it.
  EdgeOcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/edge_ocr/
      Handler: app.lambda_handler
      Description: image -> OCR spatial tokens (container in Phase 4)
      Policies:
        - S3CrudPolicy: { BucketName: !Ref DocsBucket }

  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api_handler/
      Handler: app.lambda_handler
      Description: demo seeder, execution status, dashboard reads, presigned URLs
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ReconcilePipeline
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref LedgerTable }
        - S3CrudPolicy: { BucketName: !Ref DocsBucket }
        - S3ReadPolicy: { BucketName: !Ref DossierBucket }
        - Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref ReconcilePipeline
            - Effect: Allow
              Action: [states:DescribeExecution]
              Resource: !Sub
                - '${Prefix}:execution:${Name}:*'
                - Prefix: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}'
                  Name: !GetAtt ReconcilePipeline.Name
      Events:
        DemoSeed:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /demo-seed, Method: POST }
        Status:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /status, Method: GET }
        Dashboard:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /dashboard, Method: GET }
        Presign:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /presign, Method: POST }
        Dossier:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /dossier, Method: GET }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ['content-type']

  # ---------------------------------------------------------- orchestration
  ReconcilePipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/reconcile_pipeline.asl.json
      DefinitionSubstitutions:
        AstCompilerArn: !GetAtt AstCompilerFunction.Arn
        GraphReconcilerArn: !GetAtt GraphReconcilerFunction.Arn
        EdgeOcrArn: !GetAtt EdgeOcrFunction.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref AstCompilerFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref GraphReconcilerFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref EdgeOcrFunction }

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FrontendUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  DocsBucketName:
    Value: !Ref DocsBucket
  DossierBucketName:
    Value: !Ref DossierBucket
  FrontendBucketName:
    Value: !Ref FrontendBucket
  TableName:
    Value: !Ref LedgerTable
  StateMachineArn:
    Value: !Ref ReconcilePipeline
